[package]
name = "aether-runtime-os"
version = "0.1.0"
edition = "2024"
description = "Fault-tolerant, evidence-carrying runtime for autonomous and distributed AI execution"
repository = "https://github.com/aixaria0/Aether-Runtime-OS"

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
