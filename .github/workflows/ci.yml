name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: End-to-end recovery + evidence + replay demo
        run: AETHER_ROOT=.aether-ci cargo run -- demo
      - name: Replay audit persisted journal
        run: cargo run -- audit --db .aether-ci/runtime.db
      - name: Export deterministic execution receipt
        run: cargo run -- receipt latest --db .aether-ci/runtime.db --out .aether-ci/receipt.json
      - name: Validate receipt contract marker
        run: |
          grep -F '"schema": "aether-execution-receipt/v1"' .aether-ci/receipt.json
          grep -F '"scope": "LOCAL_PERSISTED_EXECUTION_JOURNAL_ONLY"' .aether-ci/receipt.json
          grep -F '"terminal_state": "Completed"' .aether-ci/receipt.json
